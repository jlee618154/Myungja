<style>
  :root{
    --ivory:#F5F0E6; --ivory-deep:#EDE5D4; --brown-deep:#3B2C21; --brown:#6E5644;
    --brown-soft:#A78E77; --orange:#D9722E; --orange-soft:#EFC9A6; --ink:#2A2118;
    --line: rgba(59,44,33,0.14); --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:var(--ivory); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .serif{ font-family:'Fraunces', serif; }
  a{ color:inherit; text-decoration:none; }
  button, input{ font-family:inherit; }

  .login-shell{
    display:grid;
    grid-template-columns:1.15fr 460px;
    height:100vh;
  }

  /* ---------- slideshow ---------- */
  .slideshow{
    position:relative;
    overflow:hidden;
    background:var(--brown-deep);
  }
  .slide{
    position:absolute; inset:0;
    background-size:cover;
    opacity:0;
    transform:scale(1.08);
    transition:opacity 1.4s cubic-bezier(.4,0,.2,1), transform 7s cubic-bezier(.16,1,.3,1);
  }
  .slide.active{
    opacity:1;
    transform:scale(1);
    z-index:2;
  }
  .slide::before{
    content:'';
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(42,33,24,0.12) 0%, rgba(42,33,24,0.1) 45%, rgba(42,33,24,0.72) 100%);
  }

  <div class="login-shell">

    <div class="slideshow">

    <div class="login-panel">

      <form onsubmit="myungjaLogin(event)">
        <div class="field">
          <label>아이디 (이메일)</label>
          <input id="loginEmail" name="loginEmail" type="email" placeholder="myungja@example.com" required>
        </div>

        <div class="login-message" id="loginMessage" aria-live="polite" style="min-height:20px;margin:-8px 0 10px;color:#b84f23;font-size:12px"></div><div class="login-message" id="loginMessage" aria-live="polite" style="min-height:20px;margin:-8px 0 10px;color:#b84f23;font-size:12px"></div><button type="submit" class="btn-login">로그인</button>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  const idxEl = document.getElementById('curIdx');
  const captionEl = document.getElementById('captionText');

  const captions = [
    "애쓰지 않아도, 오늘의 나에게 편안한 하루",
    "산을 오르는 걸음에도, 편안함은 타협하지 않아요",
    "달리는 순간에도 나답게, 명자와 함께하는 액티브 라이프"
  ];

  let current = 0;
  let timer;

  function render(){
    slides.forEach((s,i)=> s.classList.toggle('active', i===current));
    dots.forEach((d,i)=> d.classList.toggle('active', i===current));
    idxEl.textContent = String(current+1).padStart(2,'0');
    captionEl.textContent = captions[current];
  }

  function goTo(i){
    current = i;
    render();
    resetTimer();
  }

  function next(){
    current = (current+1) % slides.length;
    render();
  }

  function resetTimer(){
    clearInterval(timer);
    timer = setInterval(next, 5000);
  }

  resetTimer();
</script>
