<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 — MYUNGJA</title><link rel="stylesheet" href="myungja-unified.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#3b2c21;font-family:'Pretendard Variable',Pretendard,sans-serif}.signup-shell{min-height:calc(100vh - 74px);display:grid;grid-template-columns:minmax(360px,.95fr) minmax(480px,1.05fr)}.signup-story{position:relative;min-height:720px;background:linear-gradient(180deg,rgba(42,33,24,.08),rgba(42,33,24,.65)),url('img/outer-sway-white-1.png') center/cover}.story-copy{position:absolute;left:9%;right:9%;bottom:9%;color:#fff}.story-copy span,.signup-copy>span{font-size:10px;letter-spacing:.24em;color:#efaa7a}.story-copy h2{font:450 38px/1.35 'Fraunces','Noto Sans KR',serif;margin:16px 0}.story-copy p{font-size:13px;line-height:1.8;max-width:520px}.signup-panel{display:flex;align-items:center;justify-content:center;padding:70px 9%}.signup-copy{width:min(480px,100%)}.signup-copy h1{font:450 40px/1.2 'Fraunces','Noto Sans KR',serif;margin:13px 0 8px}.signup-sub{font-size:13px;color:#765b47;margin:0 0 34px}.member-form{display:grid;gap:17px}.field label{display:block;font-size:12px;margin-bottom:8px}.field input{width:100%;border:1px solid rgba(59,44,33,.18);background:#fffaf1;padding:14px;font:inherit;font-size:13px}.field input:focus{outline:0;border-color:#df7129}.agree{font-size:11px;line-height:1.65;color:#765b47}.signup-button{border:0;border-radius:100px;background:#3b2c21;color:#fff;padding:16px;font-weight:700;cursor:pointer}.signup-button:hover{background:#df7129}.form-message{min-height:20px;color:#b84f23;font-size:12px}.form-message.success{color:#47704c}.login-link{text-align:center;font-size:12px;color:#765b47}.login-link a{color:#df7129}@media(max-width:850px){.signup-shell{grid-template-columns:1fr}.signup-story{display:none}.signup-panel{padding:55px 24px}}</style><link rel="stylesheet" href="search-overlay.css"></head><body><header class="myungja-global-header"><div class="header-inner"><a href="index.html" class="logo">MYUNGJA</a><nav class="main-nav" aria-label="주요 메뉴"><a href="index.html#new">NEW</a><a href="top.html">TOP</a><a href="bottom.html">BOTTOM</a><a href="set.html">SET</a><a href="outer.html">OUTER</a><a href="index.html#md">MD PICK</a><a href="index.html#about">ABOUT</a></nav><div class="header-icons"><span>검색</span><a href="account.html" data-member-label>MY</a><a href="cart.html" data-cart-count>bag(0)</a></div></div></header><main class="signup-shell"><section class="signup-story"><div class="story-copy"><span>40 · 50 ACTIVE LIFE</span><h2>Move easy.<br>Live easy.</h2><p>MYUNGJA 회원이 되어 새로운 컬렉션과 나의 선택을 한곳에서 이어가세요.</p></div></section><section class="signup-panel"><div class="signup-copy"><span>JOIN MYUNGJA</span><h1>회원가입</h1><p class="signup-sub">간단한 정보 입력으로 MYUNGJA 멤버십을 시작하세요.</p><form class="member-form" onsubmit="myungjaSignup(event)"><div class="field"><label for="memberName">이름</label><input id="memberName" name="memberName" required autocomplete="name" placeholder="이름을 입력하세요"></div><div class="field"><label for="email">이메일</label><input id="email" name="email" required type="email" autocomplete="email" placeholder="myungja@example.com"></div><div class="field"><label for="phone">휴대전화</label><input id="phone" name="phone" required autocomplete="tel" placeholder="010-0000-0000"></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" required type="password" minlength="8" autocomplete="new-password" placeholder="8자 이상 입력하세요"></div><div class="field"><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" name="confirmPassword" required type="password" minlength="8" autocomplete="new-password" placeholder="비밀번호를 다시 입력하세요"></div><label class="agree"><input type="checkbox" required> 이용약관과 개인정보 처리 안내를 확인했으며 로컬 시안 계정 생성에 동의합니다.</label><div class="form-message" id="formMessage" aria-live="polite"></div><button class="signup-button" type="submit">회원가입 완료</button><p class="login-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></p></form></div></section></main><script src="membership.js"></script><script src="myungja-unified.js"></script></body></html>
